global
    log stdout local0
    log stdout local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Circuit Breaking & Health Checks
backend api_backend
    mode http
    balance roundrobin
    option httpchk GET /api/v1/health
    
    server api1 localhost:8001 check inter 5s rise 2 fall 3
    server api2 localhost:8002 check inter 5s rise 2 fall 3
    server api3 localhost:8003 check inter 5s rise 2 fall 3
    
    # Connection pooling
    http-reuse safe
    timeout connect 5s
    timeout server 30s
    
    # Retry on failure
    retry-on all-retryable-errors
    retries 3

# Frontend
backend frontend_backend
    mode http
    balance roundrobin
    option httpchk GET /
    
    server web1 localhost:3001 check inter 5s rise 2 fall 3
    server web2 localhost:3002 check inter 5s rise 2 fall 3

# Main HTTP Frontend
frontend http_in
    bind *:80
    mode http
    
    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }

# HTTPS Frontend with mTLS
frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/server.pem verify required ca-file /etc/haproxy/certs/ca.pem
    mode http
    
    # Route based on path
    acl is_api path_beg /api
    acl is_frontend path_beg /
    
    # Add security headers
    http-response add-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response add-header X-Content-Type-Options "nosniff"
    http-response add-header X-Frame-Options "DENY"
    
    use_backend api_backend if is_api
    use_backend frontend_backend if is_frontend

# Statistics page
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
